[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meta-mcp-py"
version = "0.1.0"
description = "Serveur MCP Python pour Meta Business : Facebook Pages, Instagram et Threads (lecture + publication)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mat Bernardi" }]
keywords = ["mcp", "meta", "facebook", "instagram", "threads", "graph-api", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
meta-mcp-py = "meta_mcp.server:main"

[project.urls]
Repository = "https://github.com/mathieubernardi/Meta_Business_MCP"
Issues = "https://github.com/mathieubernardi/Meta_Business_MCP/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/meta_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "BLE", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
